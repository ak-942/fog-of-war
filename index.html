<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Explore</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="map"></div>
  <canvas id="fog-canvas"></canvas>

  <!-- Hamburger Menu Icon -->
  <button id="btnMenu" class="hamburger-btn" aria-label="Open Menu">☰</button>

  <!-- Top Stats Bar (Area | Trip Distance | Speed) -->
  <div class="top-stats-bar">
    <div class="stat-box">
      <span class="stat-label">Area</span>
      <span id="areaDisplay" class="stat-value">0 m²</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-box">
      <span class="stat-label">Distance</span>
      <span id="distanceDisplay" class="stat-value">0 m</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-box">
      <span class="stat-label">Speed</span>
      <span id="speedDisplay" class="stat-value">0 km/h</span>
    </div>
  </div>

  <!-- Bottom Right Floating Center Map Button -->
  <button id="btnCenter" class="fab-btn" title="Center Map">🎯</button>

  <!-- Sidebar Dark Overlay -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- Slide-Out Sidebar Drawer -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button id="btnCloseSidebar" class="close-btn">&times;</button>
    </div>

    <!-- Lifetime Distance Card inside Sidebar -->
    <div class="sidebar-stat-card">
      <span class="sidebar-stat-label">Overall Distance</span>
      <span id="lifetimeDistanceDisplay" class="sidebar-stat-value">0 m</span>
    </div>

    <div class="controls-vertical">
      <button id="btnToggleTracking" class="btn btn-active" title="Toggle Tracking">📡 GPS On</button>
      <button id="btnResetTrip" class="btn" title="Reset Trip Distance">🔄 Reset Trip</button>
      <button id="btnExport" class="btn" title="Export Progress">📤 Export Data</button>
      <button id="btnImport" class="btn" title="Import Progress">📥 Import Data</button>
    </div>
  </div>

  <!-- Hidden File Input for Import -->
  <input type="file" id="fileInput" accept=".json,application/json" style="display: none;" />

  <script type="module" src="/src/main.js"></script>
</body>
</html>
